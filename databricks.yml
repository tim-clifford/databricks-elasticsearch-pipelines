# Databricks Asset Bundle: databricks-elasticsearch-pipelines
#
# A self-contained framework for exporting Databricks Delta tables to Elasticsearch, deployable to a
# fresh workspace with `databricks bundle deploy`.
#
# Deploys, per Elasticsearch index, one serverless job that runs the shared notebook
# notebooks/run_index_pipeline.py with that index's config (_pipelines/pipeline_configs/<name>.yml). The per-index job
# resources are generated by scripts/gen_jobs.py; also deploys the deploy_views job.
#
# Quick start (the workspace host comes from your CLI profile; pass -p):
#   python scripts/gen_jobs.py                 # regenerate resources/<name>.job.yml from configs
#   databricks bundle validate -t dev -p <profile>
#   databricks bundle deploy   -t dev -p <profile> --var="environment=<env>"

bundle:
  name: databricks_elasticsearch_pipelines

# Sync the whole repo so the job notebook (and everything it will grow to import) is available
# under ${workspace.file_path}. Run bundle commands from the repo root.
sync:
  paths:
    - .

include:
  - resources/*.yml

variables:
  # Folded into any config name that contains ${environment} (e.g. ocsf_${environment} -> ocsf_prod).
  # Defaults to empty: not every deployment has an environment component, and a config that uses the
  # token but gets an empty value fails closed at resolve time. All other object naming (catalog,
  # schema, table, view name) lives per pipeline in _pipelines/pipeline_configs/<name>.yml.
  environment:
    description: "Environment folded into ${environment} in config names. Empty if unused."
    default: ""

  # One GLOBAL connector wheel serves every per-index job, so it is a bundle variable, not per-config.
  # Empty default (the path is environment-specific): variable-only commands like `bundle run
  # deploy_views` resolve without it, while an index-job run with an empty wheel_path fails closed in
  # the runner. Supply it at deploy, e.g.
  #   --var="wheel_path=/Volumes/<catalog>/<schema>/<volume>/databricks_es_connector-<version>-py3-none-any.whl"
  # See the README "Configuration" / "Deploy and run" sections for the full rationale (deploy-time
  # resolution, version-in-filename, forking).
  wheel_path:
    description: "UC Volume path to the databricks-es-connector wheel every index job installs (version lives in the filename). Empty default; required for index-job runs (fails closed if empty)."
    default: ""

  # GLOBAL Elasticsearch connection settings, shared by every index job (like wheel_path): the
  # endpoint, and the Databricks secret scope + key holding the ES api_key the connector authenticates
  # with. Kept out of per-config YAML because they are workspace-wide, not per-index. Deploy-time
  # (baked in at deploy, not overridable on run); empty default so variable-only commands like `bundle
  # run deploy_views` resolve without them, while an index-job run with any of them empty fails closed
  # in the runner. Supply at deploy, e.g. --var="es_host_url=https://<host>:9200".
  es_host_url:
    description: "Elasticsearch endpoint every index job writes to, e.g. https://<host>:9200. Empty default; required for index-job runs."
    default: ""
  secret_scope_name:
    description: "Databricks secret scope holding the ES api_key. Empty default; required for index-job runs."
    default: ""
  secret_key_name:
    description: "Key within secret_scope_name whose value is the ES api_key passed to the connector. Empty default; required for index-job runs."
    default: ""

  # GLOBAL base path (a UC Volume) under which each STREAMING index job keeps its Structured
  # Streaming checkpoint. The runner appends /<config_name> so every stream gets a stable, unique
  # subfolder. Global like wheel_path (one base for all jobs); deploy-time; empty default so batch
  # runs and `deploy_views` (which never stream) resolve without it. A STREAMING run with an empty
  # value fails closed in the runner. Must be a UC Volume path: dbfs:/tmp checkpoints fail with
  # INSUFFICIENT_PERMISSIONS on serverless. Supply at deploy, e.g.
  #   --var="checkpoint_base_path=/Volumes/<catalog>/<schema>/<volume>/checkpoints"
  checkpoint_base_path:
    description: "UC Volume base path for streaming checkpoints; the runner appends /<config_name> per job. Empty default; required for streaming runs (fails closed if empty)."
    default: ""

# Targets differ only by deployment mode. The workspace HOST is intentionally not hardcoded here:
# it is taken from your Databricks CLI profile (pass `-p <profile>`) or the DATABRICKS_HOST env var,
# so the bundle carries no environment-specific URL and deploys to whatever workspace you point it at.
targets:
  dev:
    default: true
    mode: development

  prd:
    mode: production
    workspace:
      root_path: /Workspace/databricks_elasticsearch_pipelines/.bundle/${bundle.name}/${bundle.target}
