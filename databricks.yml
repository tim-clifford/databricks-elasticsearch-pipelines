# Databricks Asset Bundle: databricks-elasticsearch-pipelines
#
# A self-contained framework for exporting Databricks Delta tables to Elasticsearch, deployable to a
# fresh workspace with `databricks bundle deploy`.
#
# Deploys a serverless job (`elasticsearch_pipeline`) whose notebook task installs the
# `databricks-es-connector` wheel from a required UC Volume path, imports it to prove the install is
# usable, and carries a `pipeline_mode` (batch|streaming) the runner branches on.
#
# Quick start (the workspace host comes from your CLI profile; pass -p, and set wheel_path):
#   databricks bundle validate -t dev -p <profile>
#   databricks bundle deploy   -t dev -p <profile> --var="wheel_path=/Volumes/<cat>/<schema>/<vol>/databricks_es_connector-<version>-py3-none-any.whl"
#   databricks bundle run elasticsearch_pipeline -t dev -p <profile>
#
# Environment prerequisite (NOT created by this bundle): the databricks-es-connector wheel must
# already exist on the UC Volume path given by `wheel_path`. See the es-databricks-connector repo
# for building/uploading the wheel.

bundle:
  name: databricks_elasticsearch_pipelines

# Sync the whole repo so the job notebook (and everything it will grow to import) is available
# under ${workspace.file_path}. Run bundle commands from the repo root.
sync:
  paths:
    - .

include:
  - resources/*.yml

variables:
  wheel_path:
    description: >-
      REQUIRED, no default. UC Volume path to the databricks-es-connector wheel to install. The
      wheel location is environment-specific, so each deployment must supply it at deploy time
      (--var, a target-level override, or the DATABRICKS_BUNDLE_VAR_wheel_path env var). Example:
      /Volumes/<catalog>/<schema>/<volume>/databricks_es_connector-<version>-py3-none-any.whl
  pipeline_mode:
    description: >-
      Export mode: 'batch' or 'streaming'. Validated at run time; the runner branches on it.
    default: "batch"

# Targets differ only by deployment mode. The workspace HOST is intentionally not hardcoded here:
# it is taken from your Databricks CLI profile (pass `-p <profile>`) or the DATABRICKS_HOST env var,
# so the bundle carries no environment-specific URL and deploys to whatever workspace you point it at.
targets:
  dev:
    default: true
    mode: development

  prd:
    mode: production
    workspace:
      root_path: /Workspace/databricks_elasticsearch_pipelines/.bundle/${bundle.name}/${bundle.target}
