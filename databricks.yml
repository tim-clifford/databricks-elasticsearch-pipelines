# Databricks Asset Bundle: databricks-elasticsearch-pipelines
#
# A self-contained framework for exporting Databricks Delta tables to Elasticsearch, deployable to a
# fresh workspace with `databricks bundle deploy`.
#
# Deploys, per Elasticsearch index, one serverless job that runs the shared notebook
# notebooks/run_index_pipeline.py with that index's config (pipeline_definitions/<name>.yml). The per-index job
# resources are generated by scripts/gen_jobs.py; also deploys the deploy_views job.
#
# Quick start (the workspace host comes from your CLI profile; pass -p):
#   python scripts/gen_jobs.py                 # regenerate resources/<name>.job.yml from configs
#   databricks bundle validate -t dev -p <profile>
#   databricks bundle deploy   -t dev -p <profile> --var="environment=<env>"

bundle:
  name: databricks_elasticsearch_pipelines

# Sync the whole repo so the job notebook (and everything it will grow to import) is available
# under ${workspace.file_path}. Run bundle commands from the repo root.
sync:
  paths:
    - .

include:
  - resources/*.yml

variables:
  # Folded into any config name that contains ${environment} (e.g. ocsf_${environment} -> ocsf_prod).
  # Defaults to empty: not every deployment has an environment component, and a config that uses the
  # token but gets an empty value fails closed at resolve time. All other object naming (catalog,
  # schema, table, view name) lives per pipeline in pipeline_definitions/<name>.yml.
  environment:
    description: "Environment folded into ${environment} in config names. Empty if unused."
    default: ""

  # One GLOBAL connector wheel serves every per-index job, so it is a bundle variable, not per-config.
  # Empty default (the path is environment-specific -- no FEVM path baked in): variable-only commands
  # like `bundle run deploy_views` resolve without it, while an index-job run with an empty wheel_path
  # fails closed in the runner. See the README "Configuration" / "Deploy and run" sections for the full
  # rationale (deploy-time resolution, version-in-filename, forking).
  wheel_path:
    description: "UC Volume path to the databricks-es-connector wheel every index job installs (version lives in the filename). Empty default; required for index-job runs (fails closed if empty)."
    default: ""

# Targets differ only by deployment mode. The workspace HOST is intentionally not hardcoded here:
# it is taken from your Databricks CLI profile (pass `-p <profile>`) or the DATABRICKS_HOST env var,
# so the bundle carries no environment-specific URL and deploys to whatever workspace you point it at.
targets:
  dev:
    default: true
    mode: development

  prd:
    mode: production
    workspace:
      root_path: /Workspace/databricks_elasticsearch_pipelines/.bundle/${bundle.name}/${bundle.target}
