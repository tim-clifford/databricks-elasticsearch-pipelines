# Databricks Asset Bundle: databricks-elasticsearch-pipelines
#
# A self-contained framework for exporting Databricks Delta tables to Elasticsearch, deployable to a
# fresh workspace with `databricks bundle deploy`.
#
# Deploys, per Elasticsearch index, one serverless job that runs the shared notebook
# notebooks/run_index_pipeline.py with that index's config (_pipelines/pipeline_configs/<name>.yml). The per-index job
# resources are generated by scripts/gen_jobs.py; also deploys the deploy_views job.
#
# Quick start (the workspace host comes from your CLI profile; pass -p):
#   python scripts/gen_jobs.py                 # regenerate resources/<name>.job.yml from configs
#   databricks bundle validate -t dev -p <profile>
#   databricks bundle deploy   -t dev -p <profile>   # env-specific values come from the target's variables block below
# (Fill in each target's variables below once for your environment. The simple string vars also accept a
# --var=<name>=<value> override at deploy; the complex es_host_* configs CAN'T be set via --var - override
# them through .databricks/bundle/<target>/variable-overrides.json instead.)

bundle:
  name: databricks_elasticsearch_pipelines
  # Deploy with the DIRECT engine (calls the Databricks REST APIs via the Go SDK) rather than the
  # legacy Terraform engine. Set explicitly so the engine is deterministic regardless of the deploying
  # CLI's default (new bundles default to direct on CLI v1.3.0+; older CLIs default to terraform). No
  # Terraform provider download, faster deploys, richer `bundle plan`. State lives in resources.json
  # (not terraform.tfstate). Requires a CLI new enough to support direct (v1.0.0+ has the engine).
  engine: direct

# Sync the whole repo so the job notebook (and everything it will grow to import) is available
# under ${workspace.file_path}. Run bundle commands from the repo root.
sync:
  paths:
    - .

include:
  - resources/*.yml

variables:
  # Folded into any config name that contains ${environment} (e.g. ocsf_${environment} -> ocsf_prod).
  # Empty default: not every deployment has an environment component, and a config that uses the token
  # but gets an empty value fails closed at run (the runner resolves the token when the job runs;
  # bundle deploy/validate don't). Set the real value PER TARGET below
  # (targets.<env>.variables); it ships empty on main. Override at deploy with --var=environment=<env>
  # if needed. All other object naming (catalog, schema, table, view name) lives per pipeline in
  # _pipelines/pipeline_configs/<name>.yml.
  environment:
    description: "Environment folded into ${environment} in config names. Empty default; set per target below or override with --var."
    default: ""

  # Branding PREFIX in every generated job's display name: `[<target>] <job_name_prefix>: <postfix>`.
  # scripts/gen_jobs.py emits ${var.job_name_prefix} into each job name, so the bundle resolves it per
  # target at deploy - rebrand every job (e.g. to a team/product name) without regenerating any files.
  # Default is the repo name; a config's or job_group's optional job_name_postfix overrides the trailing
  # <postfix> segment (default: the config name / group name). Override per target below or with
  # --var=job_name_prefix=<name>.
  job_name_prefix:
    description: "Prefix in every job display name ([<target>] <prefix>: <postfix>). Default databricks-elasticsearch-pipelines; per-target/--var overridable."
    default: databricks-elasticsearch-pipelines

  # One GLOBAL connector wheel serves every per-index job, so it is a bundle variable, not per-config.
  # Set it PER TARGET below (targets.<env>.variables); it ships empty on main. Empty default (the path
  # is environment-specific): variable-only commands like `bundle run deploy_views` resolve without it,
  # while an index-job run with an empty wheel_path fails closed in the runner. Override at deploy if
  # needed, e.g.
  #   --var="wheel_path=/Volumes/<catalog>/<schema>/<volume>/databricks_es_connector-<version>-py3-none-any.whl"
  # See the README "Configuration" / "Deploy and run" sections for the full rationale (version-in-filename, forking).
  wheel_path:
    description: "UC Volume path to the databricks-es-connector wheel every index job installs (version lives in the filename). Empty default; set per target below or override with --var. Required for index-job runs (fails closed if empty)."
    default: ""

  # es_diagnostics COMPUTE. The `_es diagnostics` maintenance job (resources/es_diagnostics.job.yml) runs
  # SERVERLESS by default (all three vars below empty). Set ONE of these to run it on a specific cluster
  # instead - e.g. to match the client's DBR runtime or the network/egress path the pipeline writes over.
  # This is a DEPLOY-time choice (re-deploy to change): Databricks has no run-time cluster swap. Empty
  # values are omitted from the job (so the default is genuinely serverless). Set AT MOST ONE path; setting
  # both an existing_cluster_id and a job_cluster_key makes the Jobs API reject the deploy.
  #   - diagnostics_existing_cluster_id: run on an ALREADY-RUNNING cluster by its id (a simple string, so
  #     it IS --var-settable: `--var="diagnostics_existing_cluster_id=<id>"`).
  #   - diagnostics_job_clusters + diagnostics_job_cluster_key: run on a NEW job cluster. Put the whole
  #     job_clusters list in diagnostics_job_clusters (one entry: job_cluster_key + a new_cluster spec -
  #     copy a _pipelines/job_cluster_configs/<key>.yml spec in verbatim, adding apply_policy_default_values:
  #     true if a cluster policy is enforced) and set diagnostics_job_cluster_key to that key. These are
  #     complex/keyed values, so set them per target below or in variable-overrides.json (NOT via --var).
  diagnostics_existing_cluster_id:
    description: "es_diagnostics: run on this existing cluster id instead of serverless. Empty => serverless. Simple string, --var-settable."
    default: ""
  diagnostics_job_cluster_key:
    description: "es_diagnostics: the job_cluster_key (in diagnostics_job_clusters) to run the task on. Empty => serverless (or use diagnostics_existing_cluster_id)."
    default: ""
  diagnostics_job_clusters:
    type: complex
    description: "es_diagnostics: the job's whole job_clusters list (job_cluster_key + new_cluster spec). Empty [] => serverless. Set per target / variable-overrides.json (complex; not --var-settable)."
    default: []

  # Elasticsearch HOST CONFIGS. Each is a NAMED GROUP of the three connection settings the connector
  # needs: the endpoint, and the Databricks secret scope + key holding the ES api_key it authenticates
  # with. A pipeline selects ONE by name via `es_host_config: <name>` in its
  # _pipelines/pipeline_configs/<name>.yml, and the generator (scripts/gen_jobs.py) wires that job's
  # notebook to this variable's fields (${var.<name>.es_host_url}, .secret_scope_name, .secret_key_name).
  #
  # Declared here as `type: complex` variables with an EMPTY-triple default, so a host config left
  # unconfigured fails CLOSED (the runner raises a clear "missing es_host_url", never a silent bad
  # write). The REAL per-environment values live under each target below (targets.<env>.variables):
  # deploying to a target automatically uses THAT environment's hosts - no --var needed.
  #
  # PLACEHOLDERS on main: the per-target values below ship EMPTY. Fill them in for the environments you
  # deploy to (see the README "Configuring Elasticsearch host connections"). Only the api_key VALUE is a
  # secret and it stays in the Databricks secret scope; the endpoint and the scope/key NAMES are not
  # secret, so committing them per target is fine.
  #
  # To ADD another host config (e.g. a second cluster for some pipelines): declare another complex
  # variable here with the same three empty-default fields, give it per-target values under each target
  # below, and point a pipeline at it with `es_host_config: <that name>`. See the commented
  # `es_host_secondary` example here and in the dev target below.
  es_host_primary:
    type: complex
    description: "ES host config 'es_host_primary': endpoint + secret scope/key. Per-target values under targets.<env>.variables."
    default:
      es_host_url: ""
      secret_scope_name: ""
      secret_key_name: ""
  # es_host_secondary:
  #   type: complex
  #   description: "A second ES host config. Uncomment here AND in each target's variables block, then fill in."
  #   default:
  #     es_host_url: ""
  #     secret_scope_name: ""
  #     secret_key_name: ""

  # The host config a pipeline uses when it OMITS es_host_config. Its value must name one of the
  # es_host_* complex variables above. scripts/gen_jobs.py reads THIS variable's `default:` at GENERATION
  # time to resolve an omitted es_host_config, so only the value set here applies - per-target or --var
  # overrides of default_es_host_config are NOT seen by the generator (the default host-config NAME is a
  # repo-level choice; its per-environment VALUES still live on the host config itself, above). Rename it
  # or point it at your own default host config; a pipeline that omits es_host_config AND has no default
  # declared here fails closed at generation.
  default_es_host_config:
    description: "Host config a pipeline uses when it omits es_host_config (must name an es_host_* complex variable). Read at generation time."
    default: es_host_primary

  # GLOBAL base path (a UC Volume) under which each STREAMING index job keeps its Structured
  # Streaming checkpoint. The runner appends /<config_name> so every stream gets a stable, unique
  # subfolder. Global like wheel_path (one base for all jobs). Set it PER TARGET below
  # (targets.<env>.variables); it ships empty on main. Empty default so batch runs and `deploy_views`
  # (which never stream) resolve without it; a STREAMING run with an empty value fails closed in the
  # runner. Must be a UC Volume path: dbfs:/tmp checkpoints fail with INSUFFICIENT_PERMISSIONS on
  # serverless. Override at deploy if needed, e.g.
  #   --var="checkpoint_base_path=/Volumes/<catalog>/<schema>/<volume>/checkpoints"
  # The dev target below shows how to append ${workspace.current_user.short_name} to isolate per developer.
  checkpoint_base_path:
    description: "UC Volume base path for streaming checkpoints; the runner appends /<config_name> per job. Empty default; set per target below or override with --var. Required for streaming runs (fails closed if empty)."
    default: ""

  # GLOBAL path to a CA certificate bundle (a PEM file on a UC Volume) the connector uses to verify the
  # Elasticsearch server's TLS certificate. Global like wheel_path / checkpoint_base_path (ONE bundle for
  # every job); the runner passes it to EsWriteConfig, which loads it as a local file on the driver AND
  # every executor (the connector opens it per-partition when it builds the ES client). Empty default so
  # a deployment that trusts the system CA store - or that turns TLS verification off via verify_certs -
  # resolves without it; when empty the runner omits ca_certs entirely and the connector falls back to
  # the system CAs. Set it PER TARGET below (targets.<env>.variables); it ships empty on main. Override
  # at deploy if needed, e.g.
  #   --var="ca_certs=/Volumes/<catalog>/<schema>/<volume>/certs/es-ca.pem"
  # Setting ca_certs together with verify_certs=false is a contradiction the connector rejects at run
  # (EsWriteConfig.__post_init__ raises), so pick one. This is a SINGLE GLOBAL bundle: every host config
  # shares it. Per-ENDPOINT CA pinning (a different bundle per es_host_*) is NOT supported here - it would
  # require moving ca_certs onto the es_host_* complex variables (alongside es_host_url) and refactoring
  # the generator's host-config recognizer (scripts/gen_jobs.py:_ES_HOST_CONFIG_FIELDS, which matches a
  # host config by its EXACT three-field key set) plus the field wiring. File a change if you need that.
  ca_certs:
    description: "UC Volume path to a CA bundle (PEM) the connector uses to verify the ES TLS cert. Empty default (system CAs); set per target below or override with --var. One global bundle for all host configs; incompatible with verify_certs=false."
    default: ""

  # GLOBAL default for the connector's bulk_stats diagnostics (per-partition ES bulk-send stats -
  # docs/send, round-trip ms, ES `took` ms - in the run log). This is the
  # target-wide DEFAULT: scripts/gen_jobs.py bakes ${var.bulk_stats} as the bulk_stats job-parameter
  # default for every pipeline that OMITS bulk_stats, so you can turn diagnostics on for a whole target
  # (e.g. dev) and off for another (e.g. prd) WITHOUT editing each pipeline config. Precedence, highest
  # first: a per-run `--params bulk_stats=<v>` > a pipeline's own `bulk_stats:` in its config > this
  # global default > the connector's own default (OFF). Empty default so, out of the box, diagnostics are
  # off everywhere; set it "true" per target below (or --var) to turn
  # them on target-wide. A legal value is "" / true / false (validated at generation and at run). Like
  # the other simple string vars it accepts --var=bulk_stats=true at deploy.
  bulk_stats:
    description: "Global default for connector bulk_stats diagnostics (per-partition ES bulk-send stats in the run log). Empty default (off). A pipeline's own bulk_stats and a per-run --params override this. Set true per target/--var to turn on target-wide."
    default: ""

  # GLOBAL defaults for the connector's connection/reliability tuning, threaded exactly like bulk_stats:
  # scripts/gen_jobs.py bakes ${var.request_timeout} / ${var.transport_max_retries} as the job-parameter
  # default for every pipeline that OMITS the knob, so you can raise the per-request ES timeout and the
  # whole-request retry count for a WHOLE target without editing each pipeline config. These are the
  # levers for a batch write that fails at the transport layer ("The write operation timed out"): a large
  # or slow _bulk request that exceeds the socket timeout. Precedence, highest first: a per-run
  # `--params <knob>=<v>` > a pipeline's own `<knob>:` in its config > this global default > the
  # connector's own defaults. Empty defaults so, out of the
  # box, the connector defaults apply everywhere; set them per target below (or --var) to raise them
  # target-wide. A legal request_timeout is "" or a positive integer of seconds; a legal
  # transport_max_retries is "" or a non-negative integer (0 disables transport retries). Both are
  # validated at generation and at run. Like the other simple string vars they accept
  # --var=request_timeout=120 at deploy.
  request_timeout:
    description: "Global default for EsWriteConfig request_timeout (per-request ES client timeout, seconds). Empty default (connector default applies). A pipeline's own request_timeout and a per-run --params override this. Set per target/--var to raise it target-wide."
    default: ""
  transport_max_retries:
    description: "Global default for EsWriteConfig transport_max_retries (whole-request retries on a transport failure; 0 disables). Empty default (connector default applies). A pipeline's own transport_max_retries and a per-run --params override this. Set per target/--var to raise it target-wide."
    default: ""

  # GLOBAL default for the connector's retry_transport_timeout, threaded exactly like bulk_stats (a bool
  # flag). When ON, the connector OWNS whole-request timeout retries: a bulk send that exceeds
  # request_timeout is re-sent (whole chunk) up to transport_max_retries times with backoff, in connector
  # code, instead of elasticsearch-py silently re-sending it and then a surfaced timeout failing the write
  # (which makes Spark re-run the whole batch, so a latency-bound pipeline falls behind). It builds the
  # write client with retry_on_timeout=False so the two layers do not stack; request_timeout is NOT
  # shortened. A timed-out re-send re-applies the chunk: idempotent with es_id_field, an accepted at-least-
  # once duplicate with auto-generated ids. Precedence, highest first: a per-run `--params
  # retry_transport_timeout=<v>` > a pipeline's own `retry_transport_timeout:` in its config > this global
  # default > the connector's own default (OFF). Empty default so it is off everywhere out of the box; set
  # it "true" per target below (or --var) to turn it on target-wide. A legal value is "" / true / false
  # (validated at generation and at run).
  retry_transport_timeout:
    description: "Global default for EsWriteConfig retry_transport_timeout (connector-owned whole-request timeout retry with backoff). Empty default (off). A pipeline's own retry_transport_timeout and a per-run --params override this. Set true per target/--var to turn on target-wide."
    default: ""

  # GLOBAL default for the connector's bypass_fast_path, threaded exactly like bulk_stats (a bool flag).
  # When ON, the connector skips its filter_path="errors" probe and classifies EVERY chunk on the full
  # per-item path (one send, no whole-chunk re-ship). This makes the docs_deduped / written counts EXACT
  # for op_type=create on chunks that mix new and already-indexed _ids (and avoids the auto-id re-ship
  # duplication), at the cost of a per-item response decode on clean chunks: it gives up the GIL-avoidance
  # fast path, so leave it OFF for feeds that do not need exact create counts. Precedence, highest first: a
  # per-run `--params bypass_fast_path=<v>` > a pipeline's own `bypass_fast_path:` in its config > this
  # global default > the connector's own default (OFF, fast path used). Empty default so the fast path is
  # used everywhere out of the box; set it "true" per target below (or --var) to turn it on target-wide. A
  # legal value is "" / true / false (validated at generation and at run).
  bypass_fast_path:
    description: "Global default for EsWriteConfig bypass_fast_path (skip the errors-probe fast path; classify every chunk per-item for exact op_type=create counts, at the cost of fast-path throughput). Empty default (off; fast path used). A pipeline's own bypass_fast_path and a per-run --params override this. Set true per target/--var to turn on target-wide."
    default: ""

  # GLOBAL defaults for the REMAINING run-time knobs, so EVERY run-time job parameter follows ONE uniform
  # pattern: this target-wide ${var.<name>} default < a per-pipeline config value (the config key) < a
  # per-run --params override. scripts/gen_jobs.py bakes ${var.<name>} as the job-parameter default for any
  # pipeline that OMITS the knob (driven by the pipeline_lib.config._RUNTIME_KNOBS registry), so a knob can
  # be set target-wide here WITHOUT editing each pipeline config; a config that sets the knob overrides
  # this, and --params wins per run. An empty "" default means "no target-wide default" - the pipeline's
  # own config value, else the connector/Spark/built-in default, stands - EXCEPT pipeline_mode and
  # streaming_start, which have no meaningful empty value (their validators reject "") and so carry a
  # concrete default (batch / new). op_type stays EMPTY even though it is concrete-valued: its empty form
  # defers to the connector's own default write action, and a non-empty global would force that action on
  # every omitting config. All are validated at generation (require_runtime_knobs_declared)
  # and at run, and like the other simple string vars accept a --var=<name>=<value> override at deploy.
  # (bulk_stats, request_timeout, transport_max_retries, retry_transport_timeout, and bypass_fast_path
  # above are the same pattern.)
  #
  # CAVEAT (empty-sentinel knobs): setting a NON-empty global for a knob whose unset form is "" (every knob
  # here except pipeline_mode / streaming_start) applies to EVERY pipeline that omits that knob, with no
  # per-config way to opt back out to the connector/Spark default. Most pointed for filter_condition: a
  # target-wide value is applied as a Spark predicate to every omitting pipeline's write, so leave it ""
  # unless every such pipeline's view really should carry that filter. The shipped "" defaults mean there
  # is no such inheritance out of the box.
  pipeline_mode:
    description: "Global default export mode (batch|streaming) for pipelines that omit pipeline_mode. Default batch. A pipeline's own pipeline_mode and a per-run --params override this. A continuous pipeline must set streaming EXPLICITLY (it cannot inherit this global)."
    default: batch
  filter_condition:
    description: "Global default row filter (a Spark SQL predicate) for pipelines that omit filter_condition. Empty default (no filter). A pipeline's own filter_condition and a per-run --params override this."
    default: ""
  chunk_size:
    description: "Global default EsWriteConfig chunk_size (docs per bulk request) for pipelines that omit it. Empty default (connector default applies). A pipeline's own value and a per-run --params override this."
    default: ""
  write_concurrency:
    description: "Global default EsWriteConfig write_concurrency (parallel bulk streams per partition) for pipelines that omit it. Empty default (connector default applies). A pipeline's own value and a per-run --params override this."
    default: ""
  op_type:
    description: "Global default EsWriteConfig op_type (index|create) for pipelines that omit it. Empty default (the connector's default write action applies). A pipeline's own op_type and a per-run --params override this. create is append-only and needs a deterministic es_id_field to dedup a resend (without one, replays duplicate)."
    default: ""
  require_existing_index:
    description: "Global default EsWriteConfig require_existing_index (true|false) for pipelines that omit it. Empty default (connector default applies). A pipeline's own value and a per-run --params override this."
    default: ""
  verify_certs:
    description: "Global default EsWriteConfig verify_certs (true|false) for pipelines that omit it. Empty default (connector default applies). A pipeline's own value and a per-run --params override this. Incompatible with a set ca_certs when false (the connector rejects that combination)."
    default: ""
  streaming_start:
    description: "Global default first-run stream position (new|full) for pipelines that omit streaming_start. Default new (only new commits; full backfills the whole table). A pipeline's own value and a per-run --params override this. Streaming only; honored on a first run before a checkpoint exists."
    default: new
  write_repartition:
    description: "Global default write_repartition (partitions to repartition the write input into before bulk_write; 0 disables) for pipelines that omit it. Empty default (built-in default 0, off). A pipeline's own value and a per-run --params override this."
    default: ""
  max_partition_bytes:
    description: "Global default spark.sql.files.maxPartitionBytes for the source read (e.g. 32m; 0 leaves it unset) for pipelines that omit it. Empty default (built-in default 2m). A pipeline's own value and a per-run --params override this."
    default: ""
  max_files_per_trigger:
    description: "Global default streaming read rate-limit: max Delta files per micro-batch, for pipelines that omit it. Empty default (Spark default 1000). A pipeline's own value and a per-run --params override this. Streaming only."
    default: ""
  max_bytes_per_trigger:
    description: "Global default streaming read rate-limit: max bytes per micro-batch (e.g. 128m), for pipelines that omit it. Empty default (no cap). A pipeline's own value and a per-run --params override this. Streaming only."
    default: ""

  # TARGET-WIDE default pause_status for EVERY generated job trigger (gen_jobs.py emits pause_status:
  # ${var.schedule_pause_status} into each schedule/continuous block unless the pipeline overrides it).
  # Default PAUSED (fail-safe): triggers deploy but do NOT fire unless a target explicitly opts in, so
  # dev and stg inherit PAUSED and never fire, and only prd binds UNPAUSED to actually run them. Default
  # PAUSED (rather than relying on `mode: development` to pause dev) because an EXPLICIT pause_status is
  # honored as-is - development mode does not override it (verified live), so the safe value has to be
  # the default here. Only jobs that declare a schedule or continuous trigger are affected; on-demand
  # jobs have no trigger block. PER-PIPELINE OVERRIDE: a config may set its own top-level `pause_status:
  # PAUSED|UNPAUSED` to override this target-wide default for that one job's trigger (two-layer pattern:
  # this global default < the per-pipeline value); a pipeline that omits pause_status inherits this.
  schedule_pause_status:
    description: "Target-wide default PAUSED or UNPAUSED for all job triggers (default PAUSED = fail-safe). Only prd binds UNPAUSED so triggers fire there; dev and stg stay paused. A pipeline config's own pause_status overrides this per job."
    default: "PAUSED"

  # Cluster policy id injected into EVERY generated job cluster: gen_jobs.py emits policy_id:
  # ${var.cluster_policy_id} into each job_clusters.new_cluster, so all job_cluster-compute pipelines get
  # the policy for the workspace they deploy to (serverless and existing_cluster pipelines have no
  # new_cluster and are unaffected). Set it PER TARGET below (targets.<env>.variables); it ships empty on
  # main. A policy id is WORKSPACE-SPECIFIC (valid only in the workspace it was created in): under dev's
  # `mode: development` each engineer deploys to their OWN workspace, so a committed dev value fits only
  # one workspace - others override with --var=cluster_policy_id=<id> (which wins over the per-target
  # value). Empty default so serverless-only deployments and variable-only commands resolve without it;
  # an empty value with a job_cluster pipeline fails closed at deploy (policy_id "" is rejected by the
  # Jobs API), so provide it whenever any pipeline uses job_cluster compute.
  cluster_policy_id:
    description: "Workspace-specific cluster policy id injected into every job cluster. Empty default; set per target below or override with --var=cluster_policy_id=<id> whenever a pipeline uses job_cluster compute. Workspace-specific: dev deploys go to each engineer's own workspace."
    default: ""

  # Support email RECIPIENTS that EVERY job (generated index/group jobs, deploy_views, checkpoint_clear,
  # build_wheel) notifies when a run fails in that target. Each job emits
  # email_notifications.on_failure: ${var.support_email} plus notification_settings that suppress SKIPPED
  # runs (this bundle disables queueing, so an overlapping trigger is skipped, not a failure) and CANCELED
  # runs (a continuous job's ON_FAILURE retry cancels-and-restarts), so the address is paged only on a
  # genuine run failure. Controlled PER TARGET below: it ships EMPTY on main and stays empty ([]) for dev
  # and stg (no failure emails there), and only prd sets a real address.
  #
  # This is a `type: complex` variable holding a LIST, and the empty list [] is what turns notifications
  # OFF for a target: an empty on_failure list is an unambiguous "no recipients" (unlike a single empty
  # STRING, "", which would emit on_failure: [""] and rely on the platform silently dropping an invalid
  # empty-recipient entry - engine/version-dependent). Usually a single address, e.g.
  # ["es-oncall@yourco.com"]; add more entries to page several people. Because it is complex, it CANNOT be
  # set via --var (the CLI rejects complex-type --var, like the es_host_* configs); override dev through
  # the git-ignored .databricks/bundle/<target>/variable-overrides.json instead. See the on_failure emit
  # in scripts/gen_jobs.py _assemble_job and the hand-authored resources/*.job.yml.
  support_email:
    type: complex
    description: "Email recipients (a LIST) notified on any job/task run FAILURE in this target. Empty list [] = notifications OFF; set an address (usually one, e.g. [\"es-oncall@yourco.com\"]) only in prd below. dev/stg stay []. type: complex, so NOT settable via --var; override dev via .databricks/bundle/<target>/variable-overrides.json."
    default: []

  # OPTIONAL cluster config for existing_cluster compute. Like an ES host config, it is a `type: complex`
  # variable (a single cluster_id field) so the generator can tell cluster configs apart from other
  # variables. A pipeline that runs on an existing (interactive/all-purpose) cluster names one via
  # `compute.cluster_config: <name>` in its _pipelines/pipeline_configs/<name>.yml; the generator emits
  # existing_cluster_id: ${var.<name>.cluster_id}, resolved PER TARGET at deploy - a cluster id is
  # WORKSPACE-SPECIFIC, like cluster_policy_id, so one pipeline attaches to a different cluster per
  # environment. Shipped COMMENTED because no pipeline uses existing_cluster out of the box: to use it,
  # uncomment this declaration AND the per-target placeholders below, then set
  # `compute: {type: existing_cluster, cluster_config: interactive_primary}` in the pipeline. An empty
  # value fails closed at deploy (the Jobs API rejects an empty cluster id). A cluster_config that does not
  # name a declared cluster config fails at generation (scripts/gen_jobs.py). Add more (interactive_secondary,
  # ...) the same way for pipelines that attach to different clusters.
  # interactive_primary:
  #   type: complex
  #   description: "Existing (interactive) cluster config for existing_cluster pipelines that name it via compute.cluster_config. Per-target; empty cluster_id fails closed."
  #   default:
  #     cluster_id: ""

# Three targets: dev, stg, prd. The workspace HOST is intentionally not hardcoded here: it is taken
# from your Databricks CLI profile (pass `-p <profile>`) or the DATABRICKS_HOST env var, so the bundle
# carries no environment-specific URL and deploys to whatever workspace you point it at.
#
# Every other environment-specific value is bound PER TARGET below (targets.<env>.variables): the
# `environment` token, the connector `wheel_path`, the streaming `checkpoint_base_path`, the
# `cluster_policy_id`, the optional `ca_certs` bundle, and the Elasticsearch HOST CONFIGS. All ship as
# EMPTY placeholders on main - fill in the environments you deploy to. An empty value fails closed where
# the value is required. This replaces the older model of passing environment / wheel_path /
# checkpoint_base_path / cluster_policy_id / ca_certs as --var on every deploy: those five SIMPLE STRING
# vars still accept a --var=<name>=<value> override at
# deploy (precedence highest first: --var > BUNDLE_VAR_<name> env var >
# .databricks/bundle/<target>/variable-overrides.json > per-target value > top-level default, so a local
# overrides file or an exported BUNDLE_VAR_ env var also silently outranks the committed per-target
# value). The es_host_* configs are `type: complex` and CANNOT be set
# via --var at all (the CLI rejects it: "setting variables of complex type via --var flag is not
# supported"); override their per-target values through the git-ignored
# .databricks/bundle/<target>/variable-overrides.json instead. (ES api_key
# VALUES are never here; they live in the referenced Databricks secret scopes.)
#
# dev vs stg/prd differ by DEPLOYMENT MODE, which is the DAB best practice:
# - dev uses `mode: development`: it isolates per user (root_path defaults to the deploying user's
#   home, resource names are prefixed with the username, schedules/triggers are paused), so its
#   root_path is deliberately NOT set here - the per-user default is the point.
# - stg and prd use `mode: production`: no per-user isolation, so each sets an explicit SHARED
#   root_path (not under any user's home). ${bundle.target} in the path keeps stg and prd separate.
# Job schedules default to PAUSED (schedule_pause_status), so dev and stg deploy schedules but never
# fire them; only prd binds schedule_pause_status=UNPAUSED to actually run on the cron.
targets:
  dev:
    default: true
    mode: development
    variables:
      # DEV deploy-time values. All ship EMPTY on main - fill in for your environment (or override any of
      # them at deploy with --var=<name>=<value>). An empty value fails closed where it is required
      # (wheel_path for index runs, checkpoint_base_path for streaming, cluster_policy_id for job clusters).
      environment: ""              # e.g. dev - folded into ${environment} in config object names
      wheel_path: ""               # e.g. /Volumes/<catalog>/<schema>/<volume>/databricks_es_connector-<version>-py3-none-any.whl
      # checkpoint_base_path: append ${workspace.current_user.short_name} to give each developer their own
      # streaming checkpoints under a shared dev volume. `mode: development` isolates workspace files and
      # resource NAMES per user, but NOT UC Volume data paths, so without this two developers streaming the
      # same pipeline would collide on one checkpoint. DAB resolves the token to the deploying user at
      # deploy time; the runner then appends /<config_name>. e.g.
      #   checkpoint_base_path: /Volumes/<catalog>/<schema>/<volume>/checkpoints/${workspace.current_user.short_name}
      checkpoint_base_path: ""
      cluster_policy_id: ""        # e.g. 00156D2098BE864B - workspace-specific; in dev each engineer uses their own
      support_email: []            # empty list = failure emails OFF in dev
      # interactive_primary:       # existing/interactive cluster config (uncomment with the declaration above)
      #   cluster_id: ""           # e.g. 0123-456789-abcde
      ca_certs: ""                 # e.g. /Volumes/<catalog>/<schema>/<volume>/certs/es-ca.pem - empty => system CAs
      # bulk_stats: "true"         # turn connector bulk-send diagnostics ON for the whole dev target (a
                                   # pipeline's own bulk_stats or a --params override still wins). Empty
                                   # default (off) inherited when omitted.
      # request_timeout: "120"     # raise the per-request ES timeout (seconds) for the whole dev target;
      # transport_max_retries: "5" # and the whole-request retry count. A pipeline's own value or a
                                   # --params override still wins. Empty defaults inherit the connector
                                   # defaults when omitted.
      # retry_transport_timeout: "true"  # let the connector OWN whole-request timeout retries (re-send with
                                   # backoff instead of failing the batch) for the whole dev target. A
                                   # pipeline's own value or a --params override still wins. Empty default
                                   # (off) inherited when omitted.
      # bypass_fast_path: "true"   # skip the errors-probe fast path and classify every chunk per-item for
                                   # the whole dev target (exact docs_deduped/written counts for
                                   # op_type=create, at the cost of fast-path throughput). A pipeline's own
                                   # value or a --params override still wins. Empty default (off, fast path
                                   # used) inherited when omitted.
      # DEV Elasticsearch connection. Fill in (leave "" to fail closed until configured).
      es_host_primary:
        es_host_url: ""            # e.g. https://your-dev-es-host:9200
        secret_scope_name: ""      # Databricks secret scope holding the ES api_key
        secret_key_name: ""        # key within that scope whose value is the api_key
      # es_host_secondary:         # uncomment together with the declaration in the variables block above
      #   es_host_url: ""
      #   secret_scope_name: ""
      #   secret_key_name: ""

  stg:
    mode: production
    variables:
      # STG deploy-time values. All ship EMPTY on main - fill in (or override at deploy with --var).
      environment: ""              # e.g. staging - folded into ${environment} in config object names
      wheel_path: ""               # e.g. /Volumes/<catalog>/<schema>/<volume>/databricks_es_connector-<version>-py3-none-any.whl
      checkpoint_base_path: ""     # e.g. /Volumes/<catalog>/<schema>/<volume>/checkpoints (UC Volume; required only for streaming)
      cluster_policy_id: ""        # workspace-specific; required only if a pipeline uses job_cluster compute
      support_email: []            # empty list = failure emails OFF in stg
      # interactive_primary:       # existing/interactive cluster config (uncomment with the declaration above)
      #   cluster_id: ""
      ca_certs: ""                 # /Volumes/<catalog>/<schema>/<volume>/certs/es-ca.pem - empty => system CAs
      # STG Elasticsearch connection. Fill in (leave "" to fail closed until configured).
      es_host_primary:
        es_host_url: ""            # e.g. https://your-stg-es-host:9200
        secret_scope_name: ""
        secret_key_name: ""
      # es_host_secondary:         # uncomment together with the declaration in the variables block above
      #   es_host_url: ""
      #   secret_scope_name: ""
      #   secret_key_name: ""
    workspace:
      root_path: /Workspace/databricks_elasticsearch_pipelines/.bundle/${bundle.name}/${bundle.target}

  prd:
    mode: production
    variables:
      schedule_pause_status: UNPAUSED
      # PRD deploy-time values. All ship EMPTY on main - fill in (or override at deploy with --var).
      environment: ""              # e.g. prod - folded into ${environment} in config object names
      wheel_path: ""               # e.g. /Volumes/<catalog>/<schema>/<volume>/databricks_es_connector-<version>-py3-none-any.whl
      checkpoint_base_path: ""     # e.g. /Volumes/<catalog>/<schema>/<volume>/checkpoints (UC Volume; required only for streaming)
      cluster_policy_id: ""        # workspace-specific; required only if a pipeline uses job_cluster compute
      support_email: []            # e.g. ["es-oncall@yourco.com"] to page prd failures; empty list ships on main (off)
      # interactive_primary:       # existing/interactive cluster config (uncomment with the declaration above)
      #   cluster_id: ""
      ca_certs: ""                 # /Volumes/<catalog>/<schema>/<volume>/certs/es-ca.pem - empty => system CAs
      # PRD Elasticsearch connection. Fill in (leave "" to fail closed until configured).
      es_host_primary:
        es_host_url: ""            # e.g. https://your-prd-es-host:9200
        secret_scope_name: ""
        secret_key_name: ""
      # es_host_secondary:         # uncomment together with the declaration in the variables block above
      #   es_host_url: ""
      #   secret_scope_name: ""
      #   secret_key_name: ""
    workspace:
      root_path: /Workspace/databricks_elasticsearch_pipelines/.bundle/${bundle.name}/${bundle.target}
