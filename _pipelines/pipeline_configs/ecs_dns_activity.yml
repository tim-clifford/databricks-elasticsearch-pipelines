# Pipeline definition for one Elasticsearch index. One file here => one deployed job (see
# scripts/gen_jobs.py) and one view (see _pipelines/pipeline_views/<view.name>.sql, deployed by the deploy_views job).
#
# Any catalog/schema/table/name may embed ${environment}, folded in at deploy time from the
# `environment` bundle variable (e.g. ocsf_${environment} -> ocsf_prod). A value with no token is
# used as-is.
es_index_name: ecs-dns-activity   # target Elasticsearch index (hyphens allowed)
es_id_field: dsl_id               # view output column passed to the connector as the ES document _id
pipeline_mode: batch              # default export mode: batch | streaming (override per run with --params)
# filter_condition: "action = 'allowed'"   # OPTIONAL default row filter (Spark SQL); override per run
# chunk_size: 1000                # OPTIONAL EsWriteConfig tuning: docs per bulk request (override per run)
# require_existing_index: true    # OPTIONAL EsWriteConfig tuning: require the ES index to exist first
# verify_certs: true              # OPTIONAL EsWriteConfig tuning: verify the ES TLS certificate
# max_partition_bytes: 2m         # OPTIONAL: spark.sql.files.maxPartitionBytes for the source read
#                                 # (read/scan parallelism). Smaller => more, smaller splits => the
#                                 # scan+transform fans out across more cores. Primary parallelism
#                                 # lever. Tune for ~2-3x worker cores partitions
#                                 # (~data_size/(2-3x cores)); 0 leaves the engine default.
# write_repartition: 0            # OPTIONAL: partitions for a pre-write repartition. 0 (default) = off:
#                                 # read parallelism above already carries through the (shuffle-free)
#                                 # view to the write. Set > 0 (~2-3x worker cores) only if the view
#                                 # shuffles (non-broadcast join / GROUP BY / window).

view:                             # the view this pipeline creates and exports
  catalog: tim_clifford_classic_dsl_lite_${environment}
  schema: es_poc
  name: ecs_dns_activity

source:                           # the single source table the view reads from
  catalog: tim_clifford_classic_dsl_lite_${environment}
  schema: ocsf
  table: dns_activity
  primary_key: dsl_id             # source-table column identifying a unique row (for the streaming read)

reference_tables:                 # OPTIONAL: extra tables the view joins
  # The key (`validation`) is YOUR choice: it is the SQL alias the view joins against and must match
  # the ${ref_validation} token used in _pipelines/pipeline_views/ecs_dns_activity.sql. This one uses an
  # environment-specific schema to exercise ${environment} on a reference table.
  validation:
    catalog: tim_clifford_classic_dsl_lite_${environment}
    schema: ocsf_validation_${environment}
    table: dns_activity

schedule:                         # OPTIONAL: run this job on a Quartz cron (UTC); omit for on-demand
  quartz_cron_expression: "0 */10 * * * ?"   # every 10 minutes (paused under dev + stg; fires under prd)
