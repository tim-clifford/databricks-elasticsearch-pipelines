# Pipeline definition for one Elasticsearch index. One file here => one deployed job (see
# scripts/gen_jobs.py) and one view (see _pipelines/pipeline_views/<view.name>.sql, deployed by the deploy_views job).
#
# Any catalog/schema/table/name may embed ${environment}, folded in at deploy time from the
# `environment` bundle variable (e.g. ocsf_${environment} -> ocsf_prod). A value with no token is
# used as-is.
es_index_name: ecs-authentication   # target Elasticsearch index (hyphens allowed)
es_id_field: dsl_id                 # view output column passed to the connector as the ES document _id
es_host_config: es_host_primary     # ES host config (endpoint + secret scope/key); declared in databricks.yml
pipeline_mode: streaming            # default export mode: batch | streaming (override per run with --params)

view:                               # the view this pipeline creates and exports
  catalog: tim_clifford_classic_dsl_lite_${environment}
  schema: es_poc
  name: ecs_authentication

source:                             # the single source table the view reads from
  catalog: tim_clifford_classic_dsl_lite_${environment}
  schema: ocsf
  table: authentication
  primary_key: dsl_id               # source-table column identifying a unique row (for the streaming read)

# No reference_tables: this view is a straight passthrough over its source table.
