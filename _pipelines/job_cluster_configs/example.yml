# EXAMPLE reusable job-cluster spec. Copy this file to <your_key>.yml, edit the fields for your
# workspace, then point a pipeline at it from its config:
#
#   # _pipelines/pipeline_configs/<name>.yml
#   compute:
#     type: job_cluster
#     job_cluster_config: <your_key>     # this file's name without the .yml extension
#
# The file's contents are a Databricks `new_cluster` spec, passed through verbatim into the generated
# job's job_clusters block (scripts/gen_jobs.py inlines it). Any valid new_cluster field is allowed;
# `databricks bundle validate` checks the actual field values at deploy. Defining it once here means
# several pipelines can share the same spec by key instead of repeating it. (Each job run still spins
# up its own ephemeral job cluster from this spec; for a genuinely shared always-on cluster, use
# `type: existing_cluster` with an existing_cluster_id instead.)
#
# Two things NOT to put here:
#   - policy_id: the generator injects policy_id: ${var.cluster_policy_id} into every job cluster, so
#     the target's single cluster policy is applied at deploy. A policy_id written here is overridden.
#   - environment-specific values: this spec is reused across environments; keep per-environment values
#     (like the policy) in bundle variables, not in the spec.
#
# This example is not referenced by any pipeline; it exists only to document the format. For a
# referenced, working spec see standard_batch.yml (used by the ecs_dns_activity_jobcluster pipeline).
spark_version: "15.4.x-scala2.12"
node_type_id: "m5d.large"
num_workers: 2
# REQUIRED for this framework: the runner installs the connector wheel from a UC Volume and reads UC
# tables, so a job cluster needs a Unity-Catalog-enabled access mode or the %pip install fails (a
# classic cluster with no access mode cannot see /Volumes). DATA_SECURITY_MODE_STANDARD is the
# "Standard" (USER_ISOLATION) mode; SINGLE_USER ("Dedicated") is the other option. Serverless pipelines
# get UC access implicitly.
data_security_mode: DATA_SECURITY_MODE_STANDARD
# custom_tags are HARDCODED name/value pairs that ride the verbatim passthrough straight onto the
# cluster (not templated, not environment-specific). Use them for cost/ownership tagging, e.g.:
custom_tags:
  project: elastic
# Autoscale instead of a fixed worker count:
# autoscale:
#   min_workers: 2
#   max_workers: 8
# spark_conf:
#   spark.databricks.delta.preview.enabled: "true"
