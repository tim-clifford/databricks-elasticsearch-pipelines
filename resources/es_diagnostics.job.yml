resources:
  jobs:
    es_diagnostics:
      name: "[${bundle.target}] ${var.job_name_prefix}: _es diagnostics"
      description: >-
        A serverless, READ-ONLY maintenance job that gathers congestion diagnostics about the
        Elasticsearch host (and, optionally, one index): write thread-pool saturation and rejections,
        indexing pressure, circuit breakers, node heap/GC, cluster health and pending tasks, in-flight
        bulk tasks, hot threads, and per-index stats/settings/shards. It samples the counter endpoints
        twice (sample_interval_secs apart) so rejection/GC rates are meaningful, then prints a fail-closed
        congestion verdict. It only issues GET requests and never writes to ES. Pick which host config to
        hit at run time with the es_host_config parameter (a name from databricks.yml, default
        es_host_primary); the job carries every configured host's url + secret scope/key so the notebook
        resolves the chosen one by name. Runs serverless by default; set the diagnostics_existing_cluster_id
        or diagnostics_job_clusters+diagnostics_job_cluster_key vars to run on a specific cluster (deploy-time).

      # Run-time job parameters, all overridable with `--params <name>=<value>`:
      # - es_host_config: NAME of a host config in databricks.yml to hit (default es_host_primary). The
      #   notebook resolves it against es_host_configs_json (rendered below), fail-closed on an unknown name.
      # - index_name: an index to deep-dive; blank => cluster/node level only.
      # - verify_certs: "false" for a self-signed endpoint (ignored when ca_certs is set).
      # - sample_interval_secs: gap between the two counter samples ("0" => single snapshot).
      # - request_timeout_secs: per-request client timeout.
      parameters:
        - name: es_host_config
          default: es_host_primary
        - name: index_name
          default: ""
        - name: verify_certs
          default: "true"
        - name: sample_interval_secs
          default: "5"
        - name: request_timeout_secs
          default: "15"

      # Never run two copies at once, consistent with every index job, checkpoint_clear, and deploy_views.
      max_concurrent_runs: 1

      # Skip, don't queue: a trigger landing while a run is active is dropped (MAX_CONCURRENT_RUNS_EXCEEDED)
      # rather than queued, matching every generated job and the other maintenance jobs.
      queue:
        enabled: false

      # Notify the target's support recipients on a run failure. ${var.support_email} is a complex LIST
      # var: an empty list in dev/stg (no recipients = off) and a real address in prd. Matches every other
      # job. A diagnostic run only FAILS when it could collect nothing at all (bad host/auth/total outage);
      # a "found congestion" verdict is a successful run, so this pages only on a real inability to run.
      email_notifications:
        on_failure: ${var.support_email}
      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: true

      # Global job tags from databricks.yml (empty {} => omitted). Applied to every job; on the optional
      # job-cluster compute below they also forward onto the cluster as cluster tags. Generated jobs add an
      # es_index_list tag too; this fixed job writes no index, so it carries only the globals.
      tags: ${var.global_job_tags}

      # OPTIONAL compute. All three vars default to empty, which DAB omits, leaving the task SERVERLESS.
      # Set diagnostics_existing_cluster_id (an existing cluster) OR diagnostics_job_clusters +
      # diagnostics_job_cluster_key (a new job cluster, reusing a _pipelines/job_cluster_configs spec) to
      # run on a specific cluster. See the databricks.yml `es_diagnostics COMPUTE` block. Deploy-time only.
      job_clusters: ${var.diagnostics_job_clusters}
      tasks:
        - task_key: es_diagnostics
          existing_cluster_id: ${var.diagnostics_existing_cluster_id}
          job_cluster_key: ${var.diagnostics_job_cluster_key}
          notebook_task:
            notebook_path: ../notebooks/es_diagnostics.py
            base_parameters:
              # es_host_configs_json carries EVERY configured host config's url + secret scope/key as a
              # name -> {..} JSON map, rendered from the databricks.yml es_host_* complex vars per target
              # (bundle var references resolve at deploy, so the notebook picks by es_host_config NAME from
              # this carried-in map at run time). One "<name>": {..} block per host config; to add
              # es_host_secondary, uncomment its var in databricks.yml AND its block here.
              es_host_configs_json: >-
                {"es_host_primary": {"es_host_url": "${var.es_host_primary.es_host_url}",
                "secret_scope_name": "${var.es_host_primary.secret_scope_name}",
                "secret_key_name": "${var.es_host_primary.secret_key_name}"}}
              # es_host_secondary example (mirror the databricks.yml es_host_secondary var):
              #  {"es_host_primary": {"es_host_url": "${var.es_host_primary.es_host_url}", "secret_scope_name": "${var.es_host_primary.secret_scope_name}", "secret_key_name": "${var.es_host_primary.secret_key_name}"},
              #   "es_host_secondary": {"es_host_url": "${var.es_host_secondary.es_host_url}", "secret_scope_name": "${var.es_host_secondary.secret_scope_name}", "secret_key_name": "${var.es_host_secondary.secret_key_name}"}}
              ca_certs: ${var.ca_certs}

      # On-demand: invoke via `databricks bundle run es_diagnostics -t <target> -p <profile>
      # [--params index_name=<idx>]`. CAN_MANAGE_RUN so any teammate in `users` can trigger it, matching
      # checkpoint_clear and deploy_views.
      permissions:
        - level: CAN_MANAGE_RUN
          group_name: users
