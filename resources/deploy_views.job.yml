resources:
  jobs:
    deploy_views:
      name: "[${bundle.target}] ${var.job_name_prefix}: _deploy views"
      description: >-
        A serverless notebook task that creates or replaces one Databricks view per Elasticsearch
        index. Each view is a .sql file in _pipelines/pipeline_views/ paired with a
        _pipelines/pipeline_configs/<name>.yml; the notebook renders each view's parameters from its
        config (folding in the environment) and runs every file with spark.sql. No cluster block =>
        serverless notebook task.

      # Never run two copies at once, consistent with every index job. Fixed at 1, not parameterized.
      max_concurrent_runs: 1

      # Skip, don't queue: a trigger landing while a run is active is dropped (MAX_CONCURRENT_RUNS_EXCEEDED)
      # rather than queued. The Jobs API defaults queue.enabled to true, so this makes single-flight actually
      # skip overlaps, matching every generated job (see scripts/gen_jobs.py _assemble_job).
      queue:
        enabled: false

      # Notify the target's support recipients on a run failure. ${var.support_email} is a complex LIST
      # var: an empty list in dev/stg (no recipients = off) and a real address in prd. on_failure
      # references the whole var so the empty case is [] (not [""]). notification_settings suppress
      # SKIPPED (queue disabled => an overlapping trigger is skipped, not failed) and CANCELED runs, so
      # recipients are paged only on a genuine failure. Matches every other job (see scripts/gen_jobs.py).
      email_notifications:
        on_failure: ${var.support_email}
      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: true

      # Global job tags from databricks.yml (empty {} => omitted). Applied to every job; serverless, so
      # these are job-level tags (no cluster to forward onto). Matches every other job.
      tags: ${var.global_job_tags}

      tasks:
        - task_key: deploy_views
          notebook_task:
            notebook_path: ../notebooks/deploy_views.py
            base_parameters:
              environment: ${var.environment}

      # On-demand: invoke via `databricks bundle run deploy_views`. CAN_MANAGE_RUN so any teammate in
      # `users` can trigger it, matching that framing.
      permissions:
        - level: CAN_MANAGE_RUN
          group_name: users
