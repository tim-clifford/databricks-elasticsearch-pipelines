resources:
  jobs:
    deploy_views:
      name: "[${bundle.target}] databricks-elasticsearch-pipelines: deploy views"
      description: >-
        A serverless notebook task that creates or replaces one Databricks view per Elasticsearch
        index. Each view is a .sql file in views/ paired with a pipeline_definitions/<name>.yml; the
        notebook renders each view's parameters from its config (folding in the environment) and runs
        every file with spark.sql. No cluster block => serverless notebook task.

      tasks:
        - task_key: deploy_views
          notebook_task:
            notebook_path: ../notebooks/deploy_views.py
            base_parameters:
              environment: ${var.environment}

      # On-demand: invoke via `databricks bundle run deploy_views`. CAN_MANAGE_RUN so any teammate in
      # `users` can trigger it, matching that framing.
      permissions:
        - level: CAN_MANAGE_RUN
          group_name: users
