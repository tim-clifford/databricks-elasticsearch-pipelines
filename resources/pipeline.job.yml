resources:
  jobs:
    elasticsearch_pipeline:
      name: "[${bundle.target}] databricks-elasticsearch-pipelines: Delta -> Elasticsearch"
      description: >-
        v1 scaffold. A single serverless notebook task that installs the databricks-es-connector
        wheel from a required UC Volume path (var.wheel_path), imports it to prove the install is
        usable, and validates the export mode (var.pipeline_mode: batch|streaming). No cluster block
        => serverless notebook task.

      tasks:
        - task_key: run_pipeline
          notebook_task:
            notebook_path: ../src/run_pipeline.py
            base_parameters:
              # Surfaced to the notebook as widgets.
              wheel_path: ${var.wheel_path}
              pipeline_mode: ${var.pipeline_mode}

      # On-demand: invoke via `databricks bundle run elasticsearch_pipeline`. CAN_MANAGE_RUN (not
      # just CAN_VIEW) so any teammate in `users` can actually trigger a run, matching that framing.
      permissions:
        - level: CAN_MANAGE_RUN
          group_name: users
