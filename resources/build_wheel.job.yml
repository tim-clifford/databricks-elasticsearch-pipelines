resources:
  jobs:
    build_wheel:
      name: "[${bundle.target}] ${var.job_name_prefix}: _build wheel"
      description: >-
        A serverless maintenance job that BUILDS the databricks-es-connector wheel from a copy of the
        connector repo synced into the workspace, and PUBLISHES it into the UC Volume directory this
        bundle's wheel_path lives in. Takes two required run parameters: repo_workspace_path (the /Workspace
        path of the checked-out connector repo to build) and wheel_version (the x.x.x version, used to name
        the built wheel and to verify it was produced). The upload directory is the PARENT of
        ${var.wheel_path}; the FILENAME is rebuilt from wheel_version, NOT taken from wheel_path - so this
        job publishes whatever version you build alongside the existing wheels, and does NOT overwrite or
        repoint wheel_path. It does not put the new wheel into use: index jobs keep installing the exact
        ${var.wheel_path}, so adopting the freshly built version is a separate, deliberate step (update
        wheel_path in databricks.yml to the new filename and redeploy, when ready). No cluster block =>
        serverless notebook task.

      # Both are REQUIRED per-run job parameters. Defaults are blank; the notebook fails closed on a blank
      # or malformed value (never a no-target build/upload). Override per run with
      #   --params repo_workspace_path=/Workspace/Users/...,wheel_version=x.x.x
      # (or set them in the Run dialog).
      parameters:
        - name: repo_workspace_path
          default: ""
        - name: wheel_version
          default: ""

      # Never run two copies at once, consistent with every index job, deploy_views and checkpoint_clear.
      # Two concurrent builds could race on the same upload path. Fixed at 1.
      max_concurrent_runs: 1

      # Skip, don't queue: a trigger landing while a run is active is dropped (MAX_CONCURRENT_RUNS_EXCEEDED)
      # rather than queued, matching every generated job, deploy_views and checkpoint_clear (see
      # scripts/gen_jobs.py).
      queue:
        enabled: false

      # Notify the target's support address on a run failure. ${var.support_email} is empty in dev/stg
      # (no emails) and set only in prd. notification_settings suppress SKIPPED (queue disabled => an
      # overlapping trigger is skipped, not failed) and CANCELED runs, so the address is paged only on a
      # genuine failure. Matches every other job (see scripts/gen_jobs.py _assemble_job).
      email_notifications:
        on_failure:
          - ${var.support_email}
      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: true

      tasks:
        - task_key: build_wheel
          notebook_task:
            notebook_path: ../notebooks/build_wheel.py
            # wheel_path is the deploy-time bundle variable (the UC Volume connector wheel path). The
            # notebook takes its PARENT directory as the upload destination and rebuilds the filename from
            # the wheel_version run parameter, so the version this job publishes is governed by
            # wheel_version, not by whatever version happens to be baked into wheel_path. repo_workspace_path
            # and wheel_version arrive as job parameters (above), not here.
            base_parameters:
              wheel_path: ${var.wheel_path}

      # On-demand: invoke via
      #   databricks bundle run build_wheel --params repo_workspace_path=/Workspace/Users/...,wheel_version=x.x.x
      # CAN_MANAGE_RUN so any teammate in `users` can trigger it, matching deploy_views/checkpoint_clear.
      permissions:
        - level: CAN_MANAGE_RUN
          group_name: users
