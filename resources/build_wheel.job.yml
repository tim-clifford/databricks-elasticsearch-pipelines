resources:
  jobs:
    build_wheel:
      name: "[${bundle.target}] ${var.job_name_prefix}: _build wheel"
      description: >-
        A serverless maintenance job that BUILDS the databricks-es-connector wheel from a copy of the
        connector repo synced into the workspace, and UPLOADS it to the UC Volume directory this bundle's
        wheel_path points at (so index jobs install exactly what was built). Takes two required run
        parameters: repo_workspace_path (the /Workspace path of the checked-out connector repo to build)
        and wheel_version (the x.x.x version, used to name the built wheel and to verify it was produced).
        The upload directory is the PARENT of ${var.wheel_path} (the filename is rebuilt from
        wheel_version, not taken from wheel_path). No cluster block => serverless notebook task.

      # Both are REQUIRED per-run job parameters. Defaults are blank; the notebook fails closed on a blank
      # or malformed value (never a no-target build/upload). Override per run with
      #   --params repo_workspace_path=/Workspace/Users/...,wheel_version=x.x.x
      # (or set them in the Run dialog).
      parameters:
        - name: repo_workspace_path
          default: ""
        - name: wheel_version
          default: ""

      # Never run two copies at once, consistent with every index job, deploy_views and checkpoint_clear.
      # Two concurrent builds could race on the same upload path. Fixed at 1.
      max_concurrent_runs: 1

      # Skip, don't queue: a trigger landing while a run is active is dropped (MAX_CONCURRENT_RUNS_EXCEEDED)
      # rather than queued, matching every generated job, deploy_views and checkpoint_clear (see
      # scripts/gen_jobs.py).
      queue:
        enabled: false

      tasks:
        - task_key: build_wheel
          notebook_task:
            notebook_path: ../notebooks/build_wheel.py
            # wheel_path is the deploy-time bundle variable (the UC Volume connector wheel path). The
            # notebook takes its PARENT directory as the upload destination and rebuilds the filename from
            # the wheel_version run parameter, so the version this job publishes is governed by
            # wheel_version, not by whatever version happens to be baked into wheel_path. repo_workspace_path
            # and wheel_version arrive as job parameters (above), not here.
            base_parameters:
              wheel_path: ${var.wheel_path}

      # On-demand: invoke via
      #   databricks bundle run build_wheel --params repo_workspace_path=/Workspace/Users/...,wheel_version=x.x.x
      # CAN_MANAGE_RUN so any teammate in `users` can trigger it, matching deploy_views/checkpoint_clear.
      permissions:
        - level: CAN_MANAGE_RUN
          group_name: users
